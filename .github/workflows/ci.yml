name: CI

# Precisa do Xcode 26.6 ou mais novo: os pacotes declaram `platforms: [.iOS(.v26)]` e o
# provedor da Apple Intelligence usa `contextSize` (SDK do iOS 26.4). O Xcode 26.3 da
# imagem macos-15 parava o build no OdeteAgent. A nuvem privada (SDK do iOS 27) fica atrás
# de `#if compiler(>=6.4)` enquanto o GitHub não tiver o Xcode 27.
on:
  push:
    branches: [main, iOS]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Ferramentas
        run: brew install xcodegen swiftformat swiftlint

      - name: Formato e lint
        run: make lint

      # Frase nova entra no app em português dentro de `tr("…")`. Sem este passo ela
      # fica em português nos outros quatro idiomas para sempre, sem teste vermelho.
      - name: Catálogo de tradução
        run: make i18n

      - name: Build
        run: make build DEST='generic/platform=iOS Simulator'

      - name: Testes dos pacotes
        # O `TEST_RUNNER_` chega ao processo dos testes sem o prefixo. Desliga só os testes
        # que precisam de um WKWebView de verdade, lento demais neste simulador.
        env:
          TEST_RUNNER_ODETE_SEM_NAVEGADOR: "1"
        run: make unit DEST='platform=iOS Simulator,name=iPhone 17'
