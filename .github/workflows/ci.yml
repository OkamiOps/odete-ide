name: CI

# Precisa do Xcode 27: os pacotes declaram `platforms: [.iOS(.v26)]`, e o provedor da
# Apple Intelligence usa APIs do SDK novo (`contextSize`, `PrivateCloudComputeLanguageModel`)
# que o Xcode 26.3 da imagem macos-15 não tem — com ele o build parava no OdeteAgent.
on:
  push:
    branches: [main, iOS]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: Ferramentas
        run: brew install xcodegen swiftformat swiftlint

      - name: Formato e lint
        run: make lint

      # Frase nova entra no app em português dentro de `tr("…")`. Sem este passo ela
      # fica em português nos outros quatro idiomas para sempre, sem teste vermelho.
      - name: Catálogo de tradução
        run: make i18n

      - name: Build
        run: make build DEST='generic/platform=iOS Simulator'

      - name: Testes dos pacotes
        run: make unit DEST='platform=iOS Simulator,name=iPhone 17'
