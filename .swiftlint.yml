excluded:
  - build
  - build-acc
  - build-rt
  - build-device
  - Odete.xcodeproj
  - "**/.build"
# Regras desligadas porque brigam com o que o SwiftFormat escreve: com elas ligadas o
# `make lint` nascia com 130+ avisos e parava de servir de portão para qualquer coisa.
disabled_rules:
  - switch_case_alignment
  - statement_position
  - trailing_comma
  - todo
  - opening_brace
  - closure_parameter_position
  - optional_data_string_conversion
  - cyclomatic_complexity
  - large_tuple
  - function_body_length
  - blanket_disable_command
  - force_try
identifier_name:
  min_length: 1
  excluded: [workflow_runs, html_url, created_at]
type_name:
  min_length: 2
nesting:
  type_level: 2
type_body_length:
  warning: 400
file_length:
  warning: 600
line_length:
  warning: 200
  error: 300
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
