excluded:
  - build
  - Odete.xcodeproj
  - "**/.build"
disabled_rules:
  - trailing_comma
  - todo
  - opening_brace
  - closure_parameter_position
  - optional_data_string_conversion
  - cyclomatic_complexity
  - large_tuple
  - function_body_length
  - blanket_disable_command
  - force_try
identifier_name:
  min_length: 1
  excluded: [workflow_runs, html_url, created_at]
type_body_length:
  warning: 400
file_length:
  warning: 600
line_length:
  warning: 200
  error: 300
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
