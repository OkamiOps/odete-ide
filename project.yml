name: Odete
options:
  bundleIdPrefix: com.okamiops
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "25"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
packages:
  OdeteI18n:
    path: Packages/OdeteI18n
  OdeteCore:
    path: Packages/OdeteCore
  OdeteFiles:
    path: Packages/OdeteFiles
  OdeteEditor:
    path: Packages/OdeteEditor
  OdeteUI:
    path: Packages/OdeteUI
  OdeteGit:
    path: Packages/OdeteGit
  OdeteAccounts:
    path: Packages/OdeteAccounts
  OdeteRuntime:
    path: Packages/OdeteRuntime
  OdeteNpm:
    path: Packages/OdeteNpm
  OdeteBundler:
    path: Packages/OdeteBundler
  OdeteShell:
    path: Packages/OdeteShell
  OdetePreview:
    path: Packages/OdetePreview
  OdeteAgent:
    path: Packages/OdeteAgent
  OdeteSwift:
    path: Packages/OdeteSwift
  OdeteApp:
    path: Packages/OdeteApp
targets:
  Odete:
    type: application
    platform: iOS
    sources:
      - path: Odete
      - path: Odete/pt-BR.lproj
      - path: Odete/en.lproj
      - path: Odete/de.lproj
      - path: Odete/fr.lproj
      - path: Odete/es.lproj
    info:
      path: Odete/Info.plist
      properties:
        CFBundleDisplayName: Odete
        CFBundleName: Odete
        # Sem estas duas o XcodeGen escreve "1.0"/"1" fixos no Info.plist, e mexer em
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION acima não muda nada — o .ipa sai com
        # o número velho e o App Store Connect recusa como build repetido.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No topo do Info.plist, e não só dentro de CFBundleIcons: o actool escreve o
        # aninhado, e a validação da App Store cobra este. Sem ele o upload volta com
        # ITMS-90713 depois de vinte minutos de espera.
        CFBundleIconName: AppIcon
        # O Xcode põe esta em todo app de iOS quando gera o Info.plist sozinho; aqui o
        # arquivo é escrito à mão, então ela precisa estar escrita.
        LSRequiresIPhoneOS: true
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en, de, fr, es]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: A Odete usa o microfone para você ditar o pedido ao agente.
        NSSpeechRecognitionUsageDescription: O reconhecimento de fala transforma o que você dita em texto, no próprio iPad quando possível.
        UIApplicationSupportsIndirectInputEvents: true
        # Client ID do OAuth App do GitHub (device flow). Preencha ao registrar o app.
        OdeteGitHubClientId: ""
        NSUbiquitousContainers:
          iCloud.com.okamiops.odete:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Odete
            NSUbiquitousContainerSupportedFolderLevels: Any
        CFBundleDocumentTypes:
          - CFBundleTypeName: Projeto (zip)
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive]
          - CFBundleTypeName: Pasta
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okamiops.odete
        # Simulador: assinatura local ("-"). Sem ela o app roda, mas não ganha a
        # entitlement application-identifier e o Keychain recusa tudo com -34018.
        # Aparelho e arquivo: assinatura de verdade, pelo time, com o Xcode cuidando
        # do perfil. As duas convivem porque cada uma vale para um SDK.
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "YES"
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_STYLE[sdk=iphonesimulator*]: Manual
        DEVELOPMENT_TEAM[sdk=iphoneos*]: 7U9S5DB9K9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_ENTITLEMENTS: Odete/Odete.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Odete/OdeteSimulator.entitlements
    dependencies:
      - package: OdeteApp
        product: OdeteApp
  OdeteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/OdeteUITests
    dependencies:
      - target: Odete
schemes:
  Odete:
    build:
      targets:
        Odete: all
        OdeteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OdeteUITests
      testPlans: []
